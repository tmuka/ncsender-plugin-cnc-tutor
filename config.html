<script>
(function() {

/* BEGIN lib/tutor-machine.cjs */
// What CNC Tutor knows about the machine, read from GET /api/firmware
// (grblHAL's $ settings), GET /api/settings (ncSender's) and the server
// state ncSender sends the dialog. Nothing here talks to the controller:
// the lessons tell the operator what to do in ncSender and watch the state.

// The $ settings as { id: { value, format, name } }, from either shape
// /api/firmware gives (a list, or an object keyed by id).
function fwSettings(fw) {
  var out = {}, s = fw && fw.settings;
  if (!s) return out;
  var list = Array.isArray(s) ? s : Object.keys(s).map(function(k) { var v = s[k]; return v && v.id == null ? Object.assign({ id: k }, v) : v; });
  list.forEach(function(v) {
    if (!v || v.id == null) return;

}

function ctBit(v, i) { var n = ctNum(v); return n != null && (n & (1 << i)) !== 0; }

function ctVec(s) {

  if (p.length < 3 || p.slice(0, 3).some(function(n) { return !isFinite(n); })) return null;
  return { x: p[0], y: p[1], z: p[2], a: isFinite(p[3]) ? p[3] : 0 };
}

var CT_AXES = ['x', 'y', 'z'];
var CT_WORKSPACES = ['G54', 'G55', 'G56', 'G57', 'G58', 'G59'];

// The machine as the lessons talk about it. ncs: ncSender's settings;
// ms: the server state's machineState.
function machineFacts(fw, ncs, ms) {
  var S = fwSettings(fw), n = ncs || {}, m = ms || {};
  function setting(id) { return S[id] ? S[id].value : undefined; }
  function travel(id, key) { var v = ctNum(setting(id)); return v != null ? Math.abs(v) : ctNum(m[key]); }
  var spindleType = null, d = S['395'];
  if (d) spindleType = String(d.format).split(',').map(function(t) { return t.trim(); })[ctNum(d.value)] || null;
  var safeZ = ctNum(n.safeZHeight);
  return {
    units: n.unitsPreference === 'imperial' ? 'in' : 'mm',
    known: Object.keys(S).length > 0,
    travel: { x: travel('130', 'maxTravelX'), y: travel('131', 'maxTravelY'), z: travel('132', 'maxTravelZ') },
    maxRate: { x: ctNum(setting('110')), y: ctNum(setting('111')), z: ctNum(setting('112')) },
    homing: S['22'] ? ctBit(setting('22'), 0) : null,
    homingRequired: S['22'] ? ctBit(setting('22'), 2) : null,
    homeCorner: typeof n.homeLocation === 'string' ? n.homeLocation : null,
    softLimits: S['20'] ? ctNum(setting('20')) === 1 : null,
    hardLimits: S['21'] ? ctBit(setting('21'), 0) : null,
    pullOff: ctNum(setting('27')),
    rpm: { min: ctNum(setting('31')), max: ctNum(setting('30')) },
    laserMode: S['32'] ? ctNum(setting('32')) === 1 : null,
    spindleType: spindleType,
    safeZ: safeZ,
    park: ctVec(n.parkingLocation),
    tlsAfterHome: !!n.tlsAfterHome,
    axes: String(m.axes || 'XYZ')
  };
}

// A length in mm shown in the operator's units.
function fmtLen(mm, units, digits) {
  if (mm == null || !isFinite(mm)) return '?';
  var v = units === 'in' ? mm / 25.4 : mm;
  var dg = digits != null ? digits : units === 'in' ? 3 : 2;
  var s = v.toFixed(dg);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  if (s === '-0') s = '0';
  return s + (units === 'in' ? ' in' : ' mm');
}
// A feed in mm/min shown in the operator's units.
function fmtFeed(mmMin, units) {
  if (mmMin == null || !isFinite(mmMin)) return '?';
  return units === 'in' ? (mmMin / 25.4).toFixed(1).replace(/\.0$/, '') + ' in/min' : Math.round(mmMin) + ' mm/min';
}

function ctStatus(ms) { return String((ms && ms.status) || '').split(':')[0]; }

// The six work offsets with the active one marked.
function workOffsets(ms) {
  var m = ms || {}, active = String(m.workspace || 'G54').toUpperCase();
  return CT_WORKSPACES.map(function(w) { return { name: w, offset: ctVec(m[w.toLowerCase()]), active: w === active }; });
}
function activeOffset(ms) {
  var w = String((ms && ms.workspace) || 'G54').toLowerCase();
  return ctVec(ms && ms[w]);
}

// The live state in a few plain sentences ("Where am I").
function whereAmI(state, facts) {
  var ms = (state && state.machineState) || {}, u = (facts && facts.units) || 'mm', out = [];
  if (!ms.connected) return ['ncSender isn’t connected to the controller, so there’s nothing to read yet.'];
  var status = ctStatus(ms);
  var words = { Idle: 'idle, ready for a command', Run: 'running a move or a program', Hold: 'on hold (paused): Resume continues, Stop ends it',
    Jog: 'jogging', Alarm: 'in alarm: it stopped and won’t move until the alarm is cleared', Door: 'stopped because the safety door is open',
    Home: 'homing', Check: 'in check mode (reading G-code without moving)', Sleep: 'asleep', Tool: 'changing tools' };
  out.push('The machine is ' + (words[status] || (status || 'in an unknown state').toLowerCase()) + '.');
  out.push(ms.homed ? 'It’s homed, so its machine coordinates are true.' : 'It isn’t homed yet, so its machine coordinates may not be where they read.');
  var wpos = ctVec(ms.WPos), ws = String(ms.workspace || 'G54').toUpperCase();
  if (wpos) {
    var parts = [];
    function side(v, plus, minus) { return Math.abs(v) < 0.0005 ? null : (v > 0 ? plus : minus) + ' by ' + fmtLen(Math.abs(v), u); }
    var px = side(wpos.x, 'right', 'left'), py = side(wpos.y, 'behind', 'in front');
    if (px) parts.push(px);
    if (py) parts.push(py);
    out.push(parts.length ? 'The spindle is off X0 Y0 of ' + ws + ': ' + parts.join(' and ') + '.' : 'The spindle is right over X0 Y0 of ' + ws + '.');
    if (Math.abs(wpos.z) < 0.0005) out.push('The bit’s tip is at Z0.');
    else out.push('The bit’s tip is ' + fmtLen(Math.abs(wpos.z), u) + (wpos.z > 0 ? ' above' : ' below') + ' Z0' + (wpos.z < 0 ? ' (into the stock, if Z0 is its top).' : '.'));
  }
  if (ms.tool != null && ms.tool !== '') out.push('Tool ' + ms.tool + ' is in the spindle' + (ms.toolLengthSet ? ', and its length is measured.' : ', and its length isn’t measured since it went in.'));
  var job = state && state.jobLoaded;
  if (job && job.filename) out.push('Program loaded: ' + job.filename + (job.status && job.status !== 'idle' ? ' (' + job.status + ')' : '') + '.');
  return out;
}

// ---------- watching for what a lesson asks ----------
// A tracker remembers the state when a "Try it" started and every move
// since: a move is the change in machine position from one Idle to the next.
function startTracker(state) {
  var ms = (state && state.machineState) || {};
  var offsets = {};
  workOffsets(ms).forEach(function(w) { offsets[w.name] = w.offset; });
  return {
    start: { homed: !!ms.homed, workspace: String(ms.workspace || 'G54').toUpperCase(), offsets: offsets,
      job: state && state.jobLoaded ? { filename: state.jobLoaded.filename, status: state.jobLoaded.status } : null },
    lastIdle: ctStatus(ms) === 'Idle' ? ctVec(ms.MPos) : null,
    seen: {}, jobSeen: {}, runAfterHold: false, airZ: null, workspaces: [String(ms.workspace || 'G54').toUpperCase()], moves: [], state: state || {}
  };
}
function trackState(tr, state) {
  var ms = (state && state.machineState) || {}, status = ctStatus(ms);
  tr.state = state || {};
  if (status) tr.seen[status] = true;
  if (status === 'Run' && tr.seen.Hold) tr.runAfterHold = true;
  var job = state && state.jobLoaded;
  if (job && job.status) {
    var key = (job.filename || '') + '|' + job.status;
    // A completed job only counts once it was seen running since the start.
    if (job.status !== 'completed' || tr.jobSeen[(job.filename || '') + '|running']) tr.jobSeen[key] = true;
    if (job.status === 'running' && tr.airZ == null) { var wz = ctVec(ms.WPos); if (wz) tr.airZ = wz.z; }
  }
  var ws = String(ms.workspace || '').toUpperCase();
  if (ws && tr.workspaces.indexOf(ws) < 0) tr.workspaces.push(ws);
  // Homing, programs and alarms move the machine too: only Idle-to-Idle moves
  // with nothing else in between count as jogs.
  if (!ms.connected || /^(Home|Run|Alarm|Check|Door|Hold|Tool)$/.test(status)) { tr.lastIdle = null; return tr; }
  if (status !== 'Idle') return tr;
  var pos = ctVec(ms.MPos);
  if (!pos) return tr;
  if (tr.lastIdle) {
    var d = { x: pos.x - tr.lastIdle.x, y: pos.y - tr.lastIdle.y, z: pos.z - tr.lastIdle.z };
    if (CT_AXES.some(function(k) { return Math.abs(d[k]) > 0.0005; })) tr.moves.push(d);
  }

  return tr;
}
// The axis a move went along, when only one moved: { axis: 'x', d: 10 }.
function singleAxis(d) {
  var moved = CT_AXES.filter(function(k) { return Math.abs(d[k]) > 0.0005; });
  return moved.length === 1 ? { axis: moved[0], d: d[moved[0]] } : null;
}

// Each check: (tracker, facts) -> { items: [{ label, done, detail }], done }.
var CHECKS = {
  axes: function(tr, f) {
    var u = f.units, items = CT_AXES.map(function(k) {
      var A = k.toUpperCase(), plus = null, minus = null;
      tr.moves.forEach(function(d) { var s = singleAxis(d); if (s && s.axis === k) { if (s.d > 0) plus = s.d; else minus = s.d; } });
      return { label: 'Jog ' + A + '+ once', done: plus != null,
        detail: plus != null ? A + ' went up ' + fmtLen(plus, u, u === 'in' ? 4 : 3) + ': that’s ' + A + '+.' : minus != null ? 'That was ' + A + '−: the number went down ' + fmtLen(-minus, u, u === 'in' ? 4 : 3) + '. Try the ' + A + '+ button.' : '' };
    });

  },
  home: function(tr) {
    var ms = tr.state.machineState || {};
    var did = !!tr.seen.Home || (!tr.start.homed && !!ms.homed);
    return { items: [{ label: 'Home the machine', done: did && !!ms.homed && ctStatus(ms) === 'Idle',
      detail: tr.seen.Home && ctStatus(ms) === 'Home' ? 'Homing now…' : did ? 'Homed: every axis found its switch.' : tr.seen.Alarm ? 'An alarm came up. The Limits and alarms lesson explains it.' : '' }],
      get done() { return this.items[0].done; } };
  },
  jogSizes: function(tr, f) {
    var sizes = [];
    tr.moves.forEach(function(d) { var s = singleAxis(d); if (!s) return; var r = Math.round(Math.abs(s.d) * 1000) / 1000; if (sizes.indexOf(r) < 0) sizes.push(r); });
    var items = [0, 1, 2].map(function(i) {
      return { label: i === 0 ? 'A jog with one step size' : i === 1 ? 'A jog with a second step size' : 'A jog with a third step size', done: sizes[i] != null,
        detail: sizes[i] != null ? 'Moved ' + fmtLen(sizes[i], f.units, f.units === 'in' ? 4 : 3) + '.' : '' };
    });
    return { items: items, done: sizes.length >= 3 };
  },
  workspace: function(tr) {
    var ms = tr.state.machineState || {}, now = String(ms.workspace || 'G54').toUpperCase(), other = tr.workspaces.filter(function(w) { return w !== tr.start.workspace; });
    return { items: [
      { label: 'Switch to another work offset', done: other.length > 0, detail: other.length ? 'Seen ' + other.join(', ') + '.' : '' },
      { label: 'Switch back to ' + tr.start.workspace, done: other.length > 0 && now === tr.start.workspace, detail: other.length && now !== tr.start.workspace ? now + ' is active.' : '' }

  },
  zeroXY: function(tr, f) { return zeroCheck(tr, f, ['x', 'y']); },
  zeroZ: function(tr, f) { return zeroCheck(tr, f, ['z']); },
  loadSample: function(tr) {
    var job = tr.state.jobLoaded || {}, ok = job.filename === CT_SAMPLE_NAME;
    return { items: [{ label: 'Load the practice program', done: ok, detail: ok ? 'It’s in the visualizer.' : job.filename ? 'Loaded now: ' + job.filename + '.' : '' }], done: ok };
  },
  hold: function(tr) {
    var held = !!tr.seen.Hold, ms = tr.state.machineState || {};
    return { items: [
      { label: 'Pause a running program (Pause, or Feed Hold)', done: held, detail: held ? 'Seen: the machine stopped in Hold.' : '' },
      { label: 'Resume it', done: held && tr.runAfterHold, detail: '' }
    ], get done() { return this.items[0].done && this.items[1].done; } };
  },
  airCut: function(tr) {
    var ran = !!tr.jobSeen[CT_SAMPLE_NAME + '|running'], done = !!tr.jobSeen[CT_SAMPLE_NAME + '|completed'];
    return { items: [
      { label: 'Start the practice program with Z0 raised', done: ran || done,
        detail: tr.airZ != null && tr.airZ <= 1 ? 'Z0 didn’t look raised when it started (the bit was ' + (tr.airZ <= 0 ? 'at or below' : 'just above') + ' Z0). Stop it if it’s cutting.' : '' },
      { label: 'Watch it run to the end', done: done, detail: done ? 'Finished.' : ran ? 'Running…' : '' }
    ], done: done };
  }
};
// Did the active work offset's zero change on these axes since the start?
function zeroCheck(tr, f, axes) {
  var ms = tr.state.machineState || {}, ws = String(ms.workspace || 'G54').toUpperCase();
  var was = tr.start.offsets[ws], now = activeOffset(ms), wpos = ctVec(ms.WPos);
  var items = axes.map(function(k) {
    var A = k.toUpperCase(), changed = !!(was && now && Math.abs(now[k] - was[k]) > 0.0005);
    return { label: 'Zero ' + A + ' (in ' + ws + ')', done: changed,
      detail: changed ? A + '0 is now at machine ' + A + ' ' + fmtLen(now[k], f.units) + (wpos && Math.abs(wpos[k]) < 0.0005 ? ', right where the spindle is.' : '.') : '' };
  });
  return { items: items, done: items.every(function(i) { return i.done; }) };
}
// Loading a program while one runs would replace it under ncSender's feet.
function canLoadProgram(state) {
  var ms = (state && state.machineState) || {}, job = (state && state.jobLoaded) || {};
  return !!ms.connected && ctStatus(ms) === 'Idle' && job.status !== 'running' && job.status !== 'paused';
}
function runCheck(id, tr, facts) {
  var r = CHECKS[id](tr, facts || {});
  return { items: r.items, done: !!r.done };
}

var CT_SAMPLE_NAME = 'CNC Tutor practice.nc';

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { fwSettings: fwSettings, ctVec: ctVec, machineFacts: machineFacts, fmtLen: fmtLen, fmtFeed: fmtFeed, workOffsets: workOffsets,
    activeOffset: activeOffset, canLoadProgram: canLoadProgram, whereAmI: whereAmI, startTracker: startTracker, trackState: trackState, singleAxis: singleAxis, runCheck: runCheck,
    CHECKS: CHECKS, CT_SAMPLE_NAME: CT_SAMPLE_NAME };
}
/* END lib/tutor-machine.cjs */

/* BEGIN lib/tutor-program.cjs */
// The practice program the G-code, Check before you cut and Air cut lessons
// load into ncSender (nothing runs until the operator presses Start), and
// a plain-words reading of a G-code line.

// A 40 x 30 mm rectangle and a circle, 0.5 mm deep, in mm (G21) whatever the
// operator's units: X0 Y0 is the rectangle's front-left corner, Z0 the stock top.
function practiceProgram() {
  return [
    '(CNC Tutor practice program: a 40 x 30 mm rectangle and a circle, 0.5 mm deep)',
    '(X0 Y0 is the front-left corner of the rectangle, Z0 the top of the stock)',
    'G21 (millimeters)',
    'G90 (absolute positions)',
    'G17 (arcs in the XY plane)',
    'G0 Z15 (up to 15 mm above the stock, clear of clamps)',
    'M3 S18000 (spindle on, clockwise, 18000 RPM)',
    'G4 P5 (wait 5 seconds for the spindle to get up to speed)',
    'G0 X0 Y0 (rapid over the start corner)',
    'G1 Z-0.5 F300 (plunge 0.5 mm into the stock)',
    'G1 X40 F1000 (cut along the front)',
    'G1 Y30 (cut up the right side)',
    'G1 X0 (cut along the back)',
    'G1 Y0 (cut down the left side, back to the start)',
    'G0 Z5 (lift out of the cut)',
    'G0 X20 Y8 (rapid to the bottom of the circle)',
    'G1 Z-0.5 F300 (plunge)',
    'G2 X20 Y8 I0 J7 F1000 (a full clockwise circle around X20 Y15)',
    'G0 Z5 (lift out)',
    'M5 (spindle off)',
    'G0 Z15 (up clear of the clamps)',
    'G0 X0 Y0 (back over X0 Y0)',
    'M30 (end of the program)'
  ];
}

var CT_G = {
  0: 'Rapid move (G0): as fast as the machine goes, never for cutting',
  1: 'Straight cut (G1) at the feed rate',
  2: 'Clockwise arc (G2)', 3: 'Counterclockwise arc (G3)',
  4: 'Pause (G4) for P seconds',
  17: 'Arcs in the XY plane (G17)', 18: 'Arcs in the XZ plane (G18)', 19: 'Arcs in the YZ plane (G19)',
  20: 'Units are inches (G20)', 21: 'Units are millimeters (G21)',
  28: 'Go to the stored G28 position (G28)',
  40: 'Cutter compensation off (G40)',
  43.1: 'Tool length offset (G43.1): shifts Z by the tool’s length',
  49: 'Tool length offset off (G49)',
  53: 'This line’s position is in machine coordinates (G53)',
  54: 'Use work offset G54', 55: 'Use work offset G55', 56: 'Use work offset G56', 57: 'Use work offset G57', 58: 'Use work offset G58', 59: 'Use work offset G59',
  80: 'Canned cycle off (G80)', 81: 'Drill cycle (G81)', 83: 'Peck drill cycle (G83)',
  90: 'Positions are absolute (G90): measured from zero',
  91: 'Positions are relative (G91): measured from where the bit is',
  94: 'Feed is per minute (G94)'
};
var CT_M = {
  0: 'Program pause (M0)', 1: 'Optional pause (M1)', 2: 'End of the program (M2)',
  3: 'Spindle on, clockwise (M3)', 4: 'Spindle on, counterclockwise (M4)', 5: 'Spindle off (M5)',
  6: 'Tool change (M6)', 7: 'Mist coolant on (M7)', 8: 'Flood coolant on (M8)', 9: 'Coolant off (M9)',
  30: 'End of the program (M30)'
};

// One line in plain words: { code, comment, parts: [ 'Rapid move…', 'to X0 Y0' ] }.
function explainLine(line) {
  var s = String(line || ''), comments = [], m;
  var code = s.replace(/\(([^)]*)\)|;(.*)$/g, function(all, a, b) { comments.push((a != null ? a : b).trim()); return ' '; }).trim().toUpperCase();
  var words = [], re = /([A-Z])\s*([-+]?\d*\.?\d+)/g;
  while ((m = re.exec(code))) words.push({ l: m[1], v: Number(m[2]), raw: m[1] + m[2] });
  var parts = [], axes = [], arc = [];
  words.forEach(function(w) {
    if (w.l === 'G') parts.push(CT_G[w.v] || 'G' + w.v);
    else if (w.l === 'M') parts.push(CT_M[w.v] || 'M' + w.v);
    else if (w.l === 'X' || w.l === 'Y' || w.l === 'Z' || w.l === 'A') axes.push(w.raw);
    else if (w.l === 'I' || w.l === 'J' || w.l === 'K') arc.push(w.raw);
    else if (w.l === 'F') parts.push('feed rate ' + w.v + ' per minute (F)');
    else if (w.l === 'S') parts.push('spindle speed ' + w.v + ' RPM (S)');
    else if (w.l === 'T') parts.push('tool ' + w.v + ' (T)');
    else if (w.l === 'P') parts.push('P' + w.v);
    else if (w.l === 'N') parts.push('line number ' + w.v + ' (N)');
    else parts.push(w.raw);
  });
  if (axes.length) parts.push('to ' + axes.join(' '));
  if (arc.length) parts.push('the arc’s center is ' + arc.join(' ') + ' from its start (I, J)');
  if (!words.length && comments.length) parts.push('A comment: the machine ignores it');
  return { code: code, comment: comments.join(' '), parts: parts };
}

      '<li>Jog Z <strong>up 25 mm</strong> and zero Z there. Now the program’s Z0 is 25 mm above the stock, so every cut happens in the air. Its safe heights go up 25 mm too: check Z has that much room above, or you’ll get a soft limit alarm.</li>' +

      '<li><strong>Upcut</strong> spirals lift chips out (clean bottom, fuzzy top edge). <strong>Downcut</strong> pushes them down (clean top edge, chips packed in the slot). <strong>Compression</strong> bits do both, for plywood.</li>' +
      '<li><strong>Flutes</strong> are the cutting edges. On a hobby router, 2 flutes is usual for wood, and 1 flute for plastics and aluminum: fewer flutes leave room for bigger chips.</li></ul>' +

      '<p class="ct-formula">feed = RPM × flutes × chip load</p>' +
      '<ul><li><strong>Too small a chip</strong> (slow feed, high RPM): the edge rubs instead of cutting. Heat, burn marks, a dull bit, dust instead of chips, even fire.</li>' +
      '<li><strong>Too big a chip</strong> (fast feed): the bit is overloaded. Chatter, a rough edge, the machine straining, broken bits.</li>' +
      '<li><strong>Just right:</strong> chips, not dust; a steady, even sound; the bit warm, not hot.</li></ul>' +
      '<p>Start from the table below (the same starting points QuickCut, Gears and Spoilboard Toolbox use), make a test cut, then adjust by listening and looking at the chips. To go faster, raise the feed and keep the RPM: bigger chips carry the heat away.</p>',

      '<li><strong>Stepover</strong>: how far the bit moves over between rows when clearing a pocket, as a share of its diameter. With a flat bit, 40–50 % is normal and leaves a flat floor. With a ball bit carving 3D, 10–20 % gives a smooth surface.</li>' +
      '<li><strong>Roughing then finishing:</strong> take most of the material fast, then a light last pass for a clean wall and an exact size.</li></ul>' +

    body:

      '<ul><li><strong>Conventional</strong>: the chip starts thin and ends thick; the bit pushes back against the feed. More forgiving on a less stiff machine; it can leave a rougher edge in some woods.</li>' +
      '<li><strong>Climb</strong>: the chip starts thick and ends thin; the bit pulls itself into the work. Usually a cleaner edge, but it pulls the bit into the work, so a flexible machine can be dragged off line.</li></ul>' +
      '<p>With the spindle turning clockwise (M3), seen from above: going around the <strong>outside</strong> of a part <strong>clockwise</strong> is climb, counterclockwise is conventional. Inside a pocket it’s the reverse: counterclockwise is climb. Your CAM or plugin has a setting for it. A common habit: rough conventional, finish with a light climb pass.</p>',
    quiz: [
      { q: 'Spindle clockwise, cutting around the outside of a part counterclockwise. That’s…', a: ['Climb', 'Conventional'], right: 1, why: 'Outside a part with a clockwise spindle: clockwise is climb, counterclockwise is conventional.' }

      '<ul><li><strong>Clamps</strong> on the edges: low ones, placed where the program won’t go. Check in the visualizer.</li>' +
      '<li><strong>Screws</strong> into the spoilboard, outside the cut (use brass or plastic if the bit could reach them).</li>' +
      '<li><strong>Painter’s tape and super glue</strong>: tape on the stock and the spoilboard, glue between. Great for thin sheets.</li>' +
      '<li><strong>Dog holes and pins</strong> in the spoilboard to push the stock square against.</li>' +
      '<li><strong>Tabs</strong>: small bridges the program leaves so a cut-out part stays attached until the end. Without tabs, the last pass can catch a free part and throw it.</li></ul>' +

/* BEGIN lib/tutor-figures.cjs */
// The lessons' figures as inline SVG, colored by the dialog's CSS (ct-fig
// classes), so they follow ncSender's light and dark themes. Axis colors as
// ncSender's visualizer: X red, Y green, Z blue.
// Figures that show motion are animated with SVG's own animation (SMIL):
// each loops on one clock per figure, so the parts stay in step, and the
// dialog can pause one (svg.pauseAnimations) or show its still frame
// (data-still, in seconds) when the operator prefers reduced motion.

function ctSvg(body, w, h, label, still) {
  return '<svg class="ct-fig" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + label + '"' +
    (still != null ? ' data-still="' + still + '"' : '') + '>' + body + '</svg>';
}
// A line with a filled head at (x2, y2), in the line's class (cls-head fills it).
function ctHead(x1, y1, x2, y2, cls) {
  var a = Math.atan2(y2 - y1, x2 - x1), L = 9, W = 4.5;
  var bx = x2 - L * Math.cos(a), by = y2 - L * Math.sin(a);
  var p = [[x2, y2], [bx + W * Math.sin(a), by - W * Math.cos(a)], [bx - W * Math.sin(a), by + W * Math.cos(a)]];
  return '<polygon class="' + cls + '-head" points="' + p.map(function(q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ') + '"/>';
}
function ctArrow(x1, y1, x2, y2, cls) { return '<line class="' + cls + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"/>' + ctHead(x1, y1, x2, y2, cls); }
function ctText(x, y, t, cls, anchor) { return '<text class="' + (cls || 'f-txt') + '" x="' + x + '" y="' + y + '"' + (anchor ? ' text-anchor="' + anchor + '"' : '') + '>' + t + '</text>'; }

// ---------- animation helpers: values at keyTimes (0..1) over dur seconds, eased ----------
function ctKeys(times) { return ' keyTimes="' + times.join(';') + '" calcMode="spline" keySplines="' + times.slice(1).map(function() { return '.45 0 .25 1'; }).join(';') + '"'; }
function ctMove(points, times, dur) {
  return '<animateTransform attributeName="transform" type="translate" values="' + points.map(function(p) { return p[0] + ' ' + p[1]; }).join(';') + '"' + ctKeys(times) + ' dur="' + dur + 's" repeatCount="indefinite"/>';
}
function ctAnim(attr, values, times, dur) {
  return '<animate attributeName="' + attr + '" values="' + values.join(';') + '"' + ctKeys(times) + ' dur="' + dur + 's" repeatCount="indefinite"/>';
}
function ctFade(values, times, dur) { return ctAnim('opacity', values, times, dur); }
function ctSpin(cx, cy, secs) {
  return '<animateTransform attributeName="transform" type="rotate" from="0 ' + cx + ' ' + cy + '" to="360 ' + cx + ' ' + cy + '" dur="' + secs + 's" repeatCount="indefinite"/>';
}
// An element drawn along its own path: dash = the path's length.
function ctDraw(len, end, dur) {
  return ' stroke-dasharray="' + len + ' ' + len + '"><animate attributeName="stroke-dashoffset" values="' + len + ';0;0" keyTimes="0;' + end + ';1" dur="' + dur + 's" repeatCount="indefinite"/>';
}

// A router spindle seen from the side, the bit's tip at (x, tip).
function ctSpindle(x, tip, len) {
  var top = tip - len, flutes = '';
  for (var y = top + 3; y < tip - 4; y += 6) flutes += '<line class="f-flute" x1="' + (x - 3.5) + '" y1="' + (y + 4) + '" x2="' + (x + 3.5) + '" y2="' + y + '"/>';
  return '<rect class="f-motor" x="' + (x - 12) + '" y="' + (top - 50) + '" width="24" height="42" rx="4"/>' +
    '<rect class="f-motor-band" x="' + (x - 12) + '" y="' + (top - 40) + '" width="24" height="5"/>' +
    '<path class="f-collet" d="M' + (x - 8) + ' ' + (top - 8) + 'h16l-3 8h-10z"/>' +
    '<path class="f-bit" d="M' + (x - 3.5) + ' ' + top + 'h7v' + (len - 3) + 'l-3.5 3l-3.5 -3z"/>' + flutes;
}
// A bit seen from above: its end with two flute gullets, spinning clockwise (M3).
function ctBitTop(cx, cy, r, spin) {
  var e = r - 1.5;
  function pt(deg) { var a = deg * Math.PI / 180; return (cx + e * Math.cos(a)).toFixed(1) + ' ' + (cy + e * Math.sin(a)).toFixed(1); }
  function gullet(a) { return 'M' + cx + ' ' + cy + 'L' + pt(a) + 'A' + e + ' ' + e + ' 0 0 1 ' + pt(a + 50) + 'Z'; }
  return '<circle class="f-bitface" cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>' +
    '<g><path class="f-gullet" d="' + gullet(0) + gullet(180) + '"/>' + (spin ? ctSpin(cx, cy, spin) : '') + '</g>' +
    '<circle class="f-hub" cx="' + cx + '" cy="' + cy + '" r="' + Math.max(1.5, r * .15).toFixed(1) + '"/>';
}

function startingFeeds(bitMm, flutes, material, limits) {
  // By material, as ncCAM's (src/core/tools.js) and Spoilboard Toolbox's:
  // the chip each tooth takes grows with the bit up to a cap; feed = RPM x
  // flutes x chip; plunge 30% of the feed; depth per pass and stepover a
  // share of the bit. HDPE takes a thick chip (a thin one melts it),
  // polycarbonate one between it and acrylic's, aluminum a small one.
  // limits: the machine's max feed ($110/$111) and spindle range ($30/$31), when known.
  var MATERIALS = {
    mdf: { rpm: 18000, chip: 0.012, maxChip: 0.25, stepdown: 0.5, stepover: 0.45 },
    softwood: { rpm: 18000, chip: 0.012, maxChip: 0.25, stepdown: 0.5, stepover: 0.45 },
    hardwood: { rpm: 18000, chip: 0.009, maxChip: 0.2, stepdown: 0.35, stepover: 0.4 },
    hdpe: { rpm: 15000, chip: 0.02, maxChip: 0.25, stepdown: 0.3, stepover: 0.4 },
    acrylic: { rpm: 16000, chip: 0.015, maxChip: 0.2, stepdown: 0.3, stepover: 0.4 },
    polycarbonate: { rpm: 16000, chip: 0.018, maxChip: 0.22, stepdown: 0.3, stepover: 0.4 },
    aluminum: { rpm: 18000, chip: 0.0045, maxChip: 0.06, stepdown: 0.1, stepover: 0.25 },

}

  // The table seen from above: the bed, home, the spindle and the active zero.
  function axisRange(k) {
    var T = st.facts.travel[k], S = fwSettings(st.fw), setOrigin = S['22'] ? (Number(S['22'].value) & 8) !== 0 : false;
    var homesNeg = S['23'] ? (Number(S['23'].value) & (k === 'x' ? 1 : k === 'y' ? 2 : 4)) !== 0 : false;
    if (T == null) return null;
    return setOrigin && homesNeg ? [0, T] : [-T, 0];
  }
  function zeroMap() {
    var rx = axisRange('x'), ry = axisRange('y'), m = ms();
    if (!rx || !ry) return '<p class="ct-sub">The machine’s travel isn’t known yet.</p>';
    var W = 520, H = 340, pad = 30, sx = (W - 2 * pad) / (rx[1] - rx[0]), sy = (H - 2 * pad) / (ry[1] - ry[0]), s = Math.min(sx, sy);
    var bw = (rx[1] - rx[0]) * s, bh = (ry[1] - ry[0]) * s, ox = (W - bw) / 2, oy = (H - bh) / 2;
    function X(v) { return ox + (v - rx[0]) * s; }
    function Y(v) { return oy + bh - (v - ry[0]) * s; }
    var h = '<svg class="ct-map" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="The table from above"><rect class="bed" x="' + ox + '" y="' + oy + '" width="' + bw + '" height="' + bh + '" rx="4"/>';
    h += '<text x="' + (W / 2) + '" y="' + (oy - 8) + '" text-anchor="middle">back</text><text x="' + (W / 2) + '" y="' + (oy + bh + 18) + '" text-anchor="middle">front</text>';
    workOffsets(m).forEach(function(w) {
      if (!w.offset || w.active) return;
      var x = X(w.offset.x), y = Y(w.offset.y);
      if (x < ox - 1 || x > ox + bw + 1 || y < oy - 1 || y > oy + bh + 1) return;
      h += '<path class="other" d="M' + (x - 5) + ' ' + y + 'h10M' + x + ' ' + (y - 5) + 'v10"/><text x="' + (x + 6) + '" y="' + (y - 4) + '">' + w.name + '</text>';
    });
    var z = activeOffset(m);
    if (z) {
      var zx = X(z.x), zy = Y(z.y);
      h += '<path class="zero" d="M' + (zx - 9) + ' ' + zy + 'h18M' + zx + ' ' + (zy - 9) + 'v18"/><text class="zl" x="' + (zx + 10) + '" y="' + (zy + 14) + '">X0 Y0 (' + esc(String(m.workspace || 'G54')) + ')</text>';
    }
    var p = ctVec(m.MPos);
    if (p) h += '<circle class="spindle" cx="' + X(p.x) + '" cy="' + Y(p.y) + '" r="7"/><text x="' + (X(p.x) + (X(p.x) > W / 2 ? 10 : -10)) + '" y="' + (Y(p.y) - 10) + '" text-anchor="' + (X(p.x) > W / 2 ? 'start' : 'end') + '">spindle</text>';
    return h + '</svg>';
  }

      '<div class="ct-field"><label for="ct-f-mat">Material</label><select class="ct-select" id="ct-f-mat">' + opts + '</select></div>' +
      '<div class="ct-field"><label for="ct-f-rpm">Spindle speed (RPM)</label><input class="ct-input" id="ct-f-rpm" inputmode="numeric" value="' + esc(f.rpm || '') + '" placeholder="from the table"></div>' +
      '<div class="ct-field"><label for="ct-f-chip">Chip load (' + (inch ? 'in' : 'mm') + ')</label><input class="ct-input" id="ct-f-chip" inputmode="decimal" value="' + esc(f.chip || '') + '" placeholder="from the table"></div></div>' +
      '<p class="ct-result" id="ct-f-out"></p><p class="ct-sub" id="ct-f-start"></p>';
  }
  function num(id) { var v = Number(String($(id).value).trim()); var ok = String($(id).value).trim() === '' || (isFinite(v) && v > 0); $(id).classList.toggle('ct-bad', !ok); return isFinite(v) && v > 0 ? v : null; }
  function updateFeeds() {
    if (!$('ct-f-bit')) return;
    var inch = st.facts.units === 'in', k = inch ? 25.4 : 1;
    var bit = num('ct-f-bit'), flutes = num('ct-f-flutes'), mat = $('ct-f-mat').value, rpmIn = num('ct-f-rpm'), chipIn = num('ct-f-chip');
    var feeds = { bit: $('ct-f-bit').value, flutes: $('ct-f-flutes').value, material: mat, rpm: $('ct-f-rpm').value, chip: $('ct-f-chip').value };
    if (JSON.stringify(feeds) !== JSON.stringify(P.feeds)) { P.feeds = feeds; psave(['feeds'], feeds); }
    if (!bit || !flutes) { $('ct-f-out').textContent = 'Give the bit’s diameter and flutes.'; $('ct-f-start').textContent = ''; return; }
    var limits = { maxRpm: st.facts.rpm.max || undefined, minRpm: st.facts.rpm.min || undefined, maxFeed: Math.min(st.facts.maxRate.x || 4000, st.facts.maxRate.y || 4000) };
    var s = startingFeeds(bit * k, Math.round(flutes), mat, limits);
    var rpm = rpmIn || s.rpm, chipMm = chipIn ? chipIn * k : s.chipMm, feed = rpm * Math.round(flutes) * chipMm;
    $('ct-f-out').textContent = 'Feed = ' + Math.round(rpm) + ' × ' + Math.round(flutes) + ' × ' + (inch ? (chipMm / 25.4).toFixed(4) + ' in' : chipMm.toFixed(3) + ' mm') + ' = ' + fmtFeed(feed, st.facts.units);
    $('ct-f-start').textContent = 'Starting point for ' + MATERIAL_NAMES[mat] + ' with this bit: ' + s.rpm + ' RPM, chip ' + (inch ? (s.chipMm / 25.4).toFixed(4) + ' in' : s.chipMm.toFixed(3) + ' mm') +
      ', feed ' + fmtFeed(s.feedMm, st.facts.units) + (s.capped ? ' (held to your machine’s limit)' : '') + ', plunge ' + fmtFeed(s.plungeMm, st.facts.units) + ', depth per pass ' + L(s.stepMm) + ', stepover ' + s.stepoverPct + ' %.' +
      (feed > 4000 ? ' Over 4000 mm/min is a lot for most hobby machines: check the bit maker’s numbers.' : '');
  }

  // ---------- Try it ----------
  function renderChecks() {
    var lists = ROOT.querySelectorAll('[data-checks]');
    var active = st.tracker && st.tryLesson ? lessonById(st.tryLesson) : null;
    var res = active ? runCheck(active.tryIt.check, st.tracker, st.facts) : null;
    if (res && res.done && !P.done[active.id + ':try']) { P.done[active.id + ':try'] = true; psave(['done', active.id + ':try'], true); }
    function items(r) {
      return r.items.map(function(it) { return '<li data-done="' + (it.done ? 1 : 0) + '"><span class="ct-badge">' + (it.done ? '✓' : '·') + '</span><span>' + esc(it.label) + (it.detail ? '<span class="ct-detail">' + esc(it.detail) + '</span>' : '') + '</span></li>'; }).join('');
    }
    lists.forEach(function(ul) {
      var id = ul.getAttribute('data-checks');
      var h = res && id === st.tryLesson ? items(res) : P.done[id + ':try'] ? '<li data-done="1"><span class="ct-badge">✓</span><span>Done before. Start again to try it once more.</span></li>' : '';
      if (ul.innerHTML !== h) ul.innerHTML = h;
      var ask = ROOT.querySelector('[data-ask="' + id + '"]');
      if (ask) ask.hidden = !((res && id === st.tryLesson && res.done) || P.done[id + ':try']);
    });
    if (active && res) {
      var h2 = items(res);
      if ($('ct-mini-checks').innerHTML !== h2) $('ct-mini-checks').innerHTML = h2;
      $('ct-mini-done').hidden = !res.done;
      $('ct-mini-hint').hidden = res.done;
      $('ct-mini-back').textContent = res.done ? 'Back to the lesson ✓' : 'Back to the lesson';
    }
  }
  function startTry(id) {
    var l = lessonById(id);
    if (!ms().connected) { var n = $('ct-try-note'); if (n) { n.setAttribute('data-state', 'warn'); n.textContent = 'ncSender isn’t connected to the controller.'; } return; }
    if (st.tryLesson !== id || !st.tracker) { st.tracker = startTracker(st.state); st.tryLesson = id; keepTry(); }
    $('ct-mini-title').textContent = 'Try it · ' + l.title;
    $('ct-mini-text').innerHTML = l.tryIt.text;
    setMini(true);
    renderChecks();
  }
  // The Try it in progress survives the dialog closing (Escape closes it even as a card).
  function keepTry() {
    if (!st.sid) return;
    if (!st.tracker) return local('try:' + st.sid, null);
    var t = Object.assign({}, st.tracker, { state: null, lastIdle: null });
    local('try:' + st.sid, { lesson: st.tryLesson, tracker: t });
  }
  function restoreTry() {
    var k = st.sid ? local('try:' + st.sid) : null;
    if (!k || !k.tracker || !lessonById(k.lesson)) return;
    var tr = Object.assign(k.tracker, { state: st.state });
    if (runCheck(lessonById(k.lesson).tryIt.check, tr, st.facts).done) return local('try:' + st.sid, null);
    st.tracker = tr;
    st.tryLesson = k.lesson;
  }
  function setMini(on) {
    ROOT.classList.toggle('ct-mini', on);
    if (!on && st.page) go(st.page);
  }
  async function loadSample() {
    var note = $('ct-try-note');
    if (!canLoadProgram(st.state)) {
      note.setAttribute('data-state', 'warn');
      note.textContent = ms().connected ? 'Wait until the machine is idle and no program is running or paused: loading would replace it.' : 'ncSender isn’t connected to the controller.';
      return;
    }
    note.removeAttribute('data-state'); note.textContent = 'Loading…';
    try {
      var res = await fetch(BASE_URL + '/api/gcode-files/load-temp', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: CT_SAMPLE_NAME, content: practiceProgram().join('\n') + '\n' }) });
      if (!res.ok) throw new Error('ncSender answered ' + res.status);
      note.setAttribute('data-state', 'ok'); note.textContent = 'Loaded. Nothing moves until you press Start.';
    } catch (e) {
      note.setAttribute('data-state', 'bad'); note.textContent = 'Couldn’t load it: ' + e.message + '.';
    }
  }

  // ---------- wiring ----------
  function onClick(e) {
    var fig = e.target.closest('.ct-figbox');
    if (fig && ROOT.contains(fig)) { var svg = fig.querySelector('svg'); if (svg && svg.animationsPaused) figPause(svg, !svg.animationsPaused()); return; }
    var t = e.target.closest('button, input[type="checkbox"]');
    if (!t || !ROOT.contains(t)) return;
    var a;
    if ((a = t.getAttribute('data-pick'))) {
      setStudent(a); renderNav(); restoreTry();
      var s = student();
      return go(st.tryLesson || (s && s.lastLesson) || 'home');
    }
    if (t.id === 'ct-not-me') { st.ask = null; return go('students'); }
    if (t.id === 'ct-done-session') { endSession(); renderNav(); return go('students'); }
    if (t.id === 'ct-add-student') return addStudent();
    if ((a = t.getAttribute('data-rename'))) { st.renaming = a; go('students'); var r = $('ct-rename'); if (r) { r.focus(); r.select(); } return; }
    if (t.hasAttribute('data-rename-cancel')) { st.renaming = null; return go('students'); }
    if ((a = t.getAttribute('data-rename-save'))) {
      var nm = cleanName($('ct-rename').value), note = $('ct-rename-note');
      if (!nm) { note.setAttribute('data-state', 'bad'); note.textContent = 'Give a name.'; return; }
      if (nameTaken(cfg, nm, a)) { note.setAttribute('data-state', 'bad'); note.textContent = 'Someone already has that name.'; return; }
      cfg.students[a].name = nm; save(['students', a, 'name'], nm); st.renaming = null; renderWho(); return go('students');
    }
    if ((a = t.getAttribute('data-remove'))) {
      if (t.getAttribute('data-sure') !== '1') { t.setAttribute('data-sure', '1'); t.textContent = 'Remove ' + cfg.students[a].name + ' and their progress? Tap again'; return; }
      if (st.sid === a) endSession();
      delete cfg.students[a]; save(['students', a], undefined);
      if (cfg.current === a) { cfg.current = null; save(['current'], null); }
      local('try:' + a, null); renderNav(); return go('students');
    }
    if ((a = t.getAttribute('data-page'))) return go(a);
    if ((a = t.getAttribute('data-go'))) return go(a);
    if ((a = t.getAttribute('data-done'))) {
      var i = lessonIndex(a);
      P.done[a] = true; psave(['done', a], true); renderNav();
      return go(i < CT_LESSONS.length - 1 ? CT_LESSONS[i + 1].id : 'home');
    }
    if ((a = t.getAttribute('data-try'))) return startTry(a);
    if ((a = t.getAttribute('data-quiz'))) {
      var p = a.split(':'), l = lessonById(p[0]);
      P.answers[p[0]] = P.answers[p[0]] || {};
      P.answers[p[0]][p[1]] = Number(p[2]); psave(['answers', p[0], p[1]], Number(p[2]));
      P.firstAnswers[p[0]] = P.firstAnswers[p[0]] || {};
      if (P.firstAnswers[p[0]][p[1]] == null) { P.firstAnswers[p[0]][p[1]] = Number(p[2]); psave(['firstAnswers', p[0], p[1]], Number(p[2])); }
      var card = t.closest('.ct-card'); card.outerHTML = quizCard(l);
      return;
    }
    if ((a = t.getAttribute('data-tick'))) {
      var q = a.split(':');
      P.ticks[q[0]] = P.ticks[q[0]] || {};
      P.ticks[q[0]][q[1]] = t.checked; psave(['ticks', q[0], q[1]], t.checked);
      return;
    }
    if (t.hasAttribute('data-ask-yes') || t.hasAttribute('data-ask-no')) {
      var box = t.closest('[data-ask]'), why = box.querySelector('[data-ask-why]'), lsn = lessonById(box.getAttribute('data-ask'));
      why.hidden = false;
      why.innerHTML = t.hasAttribute('data-ask-yes') ? '<strong>Good:</strong> your axes are set the right way round.' : esc(lsn.askAfter.no);
      return;
    }
    if (t.classList.contains('ct-gline')) { t.classList.toggle('open'); return; }
    if (t.id === 'ct-load-sample') return loadSample();
    if (t.id === 'ct-reset-progress') {
      if (t.getAttribute('data-sure') !== '1') { t.setAttribute('data-sure', '1'); t.textContent = 'Sure? Tap again to clear your progress'; return; }
      P.done = {}; P.ticks = {}; P.answers = {}; P.firstAnswers = {};
      ['done', 'ticks', 'answers', 'firstAnswers'].forEach(function(k) { psave([k], {}); }); renderNav(); go('home');
    }
  }
  function addStudent() {
    var nm = cleanName($('ct-new-name').value), note = $('ct-add-note');
    if (!nm) { note.setAttribute('data-state', 'bad'); note.textContent = 'Type a name first.'; return; }
    if (nameTaken(cfg, nm)) { note.setAttribute('data-state', 'bad'); note.textContent = 'Someone already has that name: pick it above.'; return; }
    var id = newStudentId(cfg), now = new Date().toISOString(), s = ctEmptyProgress();
    s.name = nm; s.color = nextColor(cfg); s.created = now; s.lastActive = now;
    cfg.students[id] = s; save(['students', id], s);
    setStudent(id); renderNav(); go('home');
  }
  function wire() {
    ROOT.addEventListener('click', onClick);
    ROOT.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      if (e.target.id === 'ct-new-name') addStudent();
      if (e.target.id === 'ct-rename') { var b = ROOT.querySelector('[data-rename-save]'); if (b) b.click(); }
    });
    ROOT.addEventListener('input', function(e) { if (e.target.id && e.target.id.indexOf('ct-f-') === 0) updateFeeds(); });
    ROOT.addEventListener('change', function(e) { if (e.target.id === 'ct-f-mat') { $('ct-f-rpm').value = ''; $('ct-f-chip').value = ''; updateFeeds(); } });
    $('ct-close').addEventListener('click', function() { window.postMessage({ type: 'close-plugin-dialog' }, '*'); });
    $('ct-mini-back').addEventListener('click', function() { setMini(false); });
    $('ct-mini-reset').addEventListener('click', function() { st.tracker = startTracker(st.state); keepTry(); renderChecks(); });
    $('ct-mini-move').addEventListener('click', function() {
      var order = ['bl', 'tl', 'tr', 'br'], c = order[(order.indexOf(cfg.corner) + 1) % 4];
      cfg.corner = c; ROOT.setAttribute('data-corner', c); save(['corner'], c);
    });
    ROOT.setAttribute('data-corner', ['bl', 'tl', 'tr', 'br'].indexOf(cfg.corner) >= 0 ? cfg.corner : 'bl');
  }
  var feedsShown = false;
  function updateFeedsOnce() {
    var has = !!$('ct-f-bit');
    if (has && !feedsShown) updateFeeds();
    feedsShown = has;
  }

  wire();
  var view = openingView(cfg, Date.now());
  if (view.page === 'lessons') setStudent(view.student); else st.ask = view.ask || null;
  renderNav();
  restoreTry();
  go(st.sid ? st.tryLesson || local('page:' + st.sid) || 'home' : 'students');
  readAll().then(function() {
    if (!rootAlive()) return;
    renderNav();
    var typing = ROOT.contains(document.activeElement) && /INPUT|SELECT/.test(document.activeElement.tagName);
    if (!typing) go(st.page);
  });
})();
</script>
